# 矩阵按键扫描 + RTT 日志
CONFIG_GPIO=y

# 编码器：启用 input 子系统（gpio-qdec 有 DTS 节点后自动启用）
CONFIG_INPUT=y

# CAF 事件管理器（Route B：button_event + encoder_event）
CONFIG_CAF=y
CONFIG_APP_EVENT_MANAGER=y
CONFIG_CAF_BUTTON_EVENTS=y

# CAF Power Manager：空闲进入 suspended，不进入 System OFF
CONFIG_CAF_POWER_MANAGER=y
CONFIG_CAF_POWER_MANAGER_STAY_ON=y
CONFIG_CAF_POWER_MANAGER_TIMEOUT=10
CONFIG_CAF_KEEP_ALIVE_EVENTS=y

# RTT 控制台输出(按键日志通过 RTT Viewer 查看)
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y

# CAF 事件管理器需要堆内存
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_REBOOT=y
