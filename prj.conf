# 蓝牙小键盘（对齐参考 keyboard 工程）
# CAF buttons 矩阵 + 硬件 QDEC + voltage-divider 电池 + IP5306 PPI 保活

CONFIG_GPIO=y

# CAF 事件管理器
CONFIG_CAF=y
CONFIG_APP_EVENT_MANAGER=y
CONFIG_APP_EVENT_MANAGER_MAX_EVENT_CNT=256
CONFIG_CAF_BUTTON_EVENTS=y

# CAF buttons：矩阵扫描、去抖、低功耗唤醒、按键保活
CONFIG_CAF_BUTTONS=y
CONFIG_CAF_BUTTONS_PM_KEEP_ALIVE=y

# CAF Power Manager：空闲进入 suspended，不进入 System OFF
CONFIG_CAF_POWER_MANAGER=y
CONFIG_CAF_POWER_MANAGER_STAY_ON=y
CONFIG_CAF_POWER_MANAGER_TIMEOUT=120
CONFIG_CAF_POWER_MANAGER_CLEAR_RESET_REASON=y
CONFIG_CAF_KEEP_ALIVE_EVENTS=y
CONFIG_REBOOT=y

# 编码器：硬件 QDEC（sensor API）
CONFIG_SENSOR=y
CONFIG_QDEC_NRFX=y

# 电池：voltage-divider 传感器驱动
CONFIG_VOLTAGE_DIVIDER=y

# IP5306 PMIC + I2C + ADC + PPI 硬件保活
CONFIG_IP5306=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_NRFX_GPPI=y

# USB Device Next Stack：复合设备（HID Keyboard + HID Consumer + CDC ACM）
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
CONFIG_USBD_HID_IN_BUF_COUNT=4
CONFIG_USBD_HID_OUT_BUF_COUNT=2

# CDC ACM（复合设备第三接口，占位）
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USBD_CDC_ACM_CLASS=y

# ============ BLE HID（与 USB 同级，模式切换）============
# Zephyr BT 基础
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_DEVICE_NAME="ATG KBD 32500"
CONFIG_BT_DEVICE_APPEARANCE=961
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n
CONFIG_BT_CONN_CTX=y

# Advertising provisioning（CAF ble_adv 需要）
CONFIG_BT_ADV_PROV_FLAGS=y
CONFIG_BT_ADV_PROV_GAP_APPEARANCE=y
CONFIG_BT_ADV_PROV_DEVICE_NAME=y
CONFIG_BT_ADV_PROV_DEVICE_NAME_SD=y
# 设备名始终广播（默认仅在配对模式带名，绑定后搜不到）
CONFIG_BT_ADV_PROV_DEVICE_NAME_PAIRING_MODE_ONLY=n
CONFIG_BT_ADV_PROV_SWIFT_PAIR=y

# HID over GATT + BAS + DIS
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_INPUT_REP_MAX=2
CONFIG_BT_HIDS_OUTPUT_REP_MAX=1
CONFIG_BT_HIDS_ATTR_MAX=50
CONFIG_BT_GATT_CHRC_POOL_SIZE=20
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_BAS=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="atguigu"
CONFIG_BT_DIS_PNP=y
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x2FE3
CONFIG_BT_DIS_PNP_PID=0x0001
CONFIG_BT_DIS_PNP_VER=0x0100

# CAF BLE 模块
CONFIG_CAF_BLE_STATE=y
# 关闭主动请求加密：Windows 作为 HID 主机连接后会主动发起配对加密，
# 设备被动响应更稳定（避免主动 set_security 与主机初始化竞争导致 err 2）
# CONFIG_CAF_BLE_STATE_SECURITY_REQ=y
CONFIG_CAF_BLE_STATE_PM=y
CONFIG_CAF_BLE_STATE_MAX_LOCAL_ID_BONDS=1
CONFIG_CAF_MODULE_SUSPEND_EVENTS=y
CONFIG_CAF_BLE_ADV=y
CONFIG_CAF_BLE_ADV_MODULE_SUSPEND_EVENTS=y
CONFIG_CAF_BLE_ADV_FAST_ADV=y
# 关闭 accept list 过滤：删除设备后立即可重新搜索/配对（键盘场景便利优先）
# CONFIG_CAF_BLE_ADV_FILTER_ACCEPT_LIST=y
CONFIG_CAF_BLE_BOND=y
CONFIG_CAF_BLE_BOND_PEER_ERASE_CLICK=y
CONFIG_CAF_BLE_BOND_PEER_ERASE_CLICK_LONG=y
CONFIG_CAF_BLE_BOND_PEER_ERASE_CLICK_KEY_ID=3
CONFIG_CAF_BLE_BOND_PEER_ERASE_CLICK_TIMEOUT=5000

# 点击检测（旋钮按键短/长按 → 配对/清绑定）
CONFIG_CAF_CLICK_DETECTOR=y
CONFIG_CAF_CLICK_DETECTOR_DEF_PATH="click_detector_def.h"

# 绑定持久化（settings + NVS）
CONFIG_BT_SETTINGS=y
CONFIG_CAF_SETTINGS_LOADER=y
CONFIG_CAF_SETTINGS_LOADER_DEF_PATH="settings_loader_def.h"
CONFIG_CAF_SETTINGS_LOADER_USE_THREAD=y
CONFIG_CAF_SETTINGS_LOADER_THREAD_STACK_SIZE=1792
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# 日志（RTT 输出）
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384

# CAF 事件管理器需要堆内存（BLE 栈加大）
CONFIG_HEAP_MEM_POOL_SIZE=8192

# ===== WS2812 LED strip =====
CONFIG_LED=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP_SPI=y
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
