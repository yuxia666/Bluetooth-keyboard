description: IP5306 Power Management IC

compatible: "injoinic,ip5306"

include: [i2c-device.yaml]

properties:
  wakeup-gpios:
    type: phandle-array
    required: false
    description: |
      GPIO connected to IP5306 KEY pin.
      When configured, the driver generates periodic low pulses
      to prevent IP5306 from entering light-load auto-shutdown.

  keep-alive-interval-ms:
    type: int
    required: false
    default: 15000
    description: Interval between KEY keep-awive pulses (ms).

  pulse-width-ms:
    type: int
    required: false
    default: 50
    description: |
      Width of KEY low pulse (ms). Must be > 30ms per IP5306
      short-press debounce spec.
